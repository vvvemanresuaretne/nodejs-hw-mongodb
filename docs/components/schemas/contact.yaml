type: object
required:
  - _id
  - name
  - age
  - gender
  - avgMark
  - onDuty
properties:
  _id:
    description: 'Contact id'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'
  age:
    description: 'Contact age'
    type: number
    example: 12
  gender:
    description: 'Contact age'
    type: string
    enum: ['male', 'female', 'other']
  avgMark:
    description: 'Contact average mark. Should be between 1 and 12'
    type: number
    example: 9.7
  onDuty:
    description: 'Whether is contact on duty'
    type: boolean
    example: false
  parentId:
    description: 'Contact parent id'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: 'Link to contact photo'
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
