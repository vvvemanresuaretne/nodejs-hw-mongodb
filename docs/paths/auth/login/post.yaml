tags:
  - Auth
summary: User login
operationId: loginUser
description: Authenticate user and receive token
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          username:
            type: string
          password:
            type: string
        required:
          - username
          - password
responses:
  '200':
    description: Successful login
  '401':
    description: Unauthorized
