tags:
  - Contacts
summary: Partially update contact by id
operationId: updateContact
description: Обновление отдельных полей контакта по его уникальному идентификатору
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Уникальный идентификатор контакта
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  description: Поля контакта для частичного обновления
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Имя контакта
          email:
            type: string
            format: email
            description: Email контакта
          phone:
            type: string
            description: Телефон контакта
        example:
          name: Иван Иванов
          email: ivan@example.com
responses:
  '200':
    description: Контакт успешно обновлен
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Contact'
  '404':
    description: Контакт с указанным ID не найден
  '400':
    description: Неверный запрос (например, некорректные данные)
