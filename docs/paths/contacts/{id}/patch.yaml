tags:
  - Contacts
summary: Частичное обновление контакта с фото
operationId: updateContact
description: Обновление отдельных полей контакта по его уникальному идентификатору
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: Уникальный идентификатор контакта
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  description: Частичное обновление контакта с фото
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Имя контакта
          email:
            type: string
            format: email
            description: Email контакта
          phone:
            type: string
            description: Телефон контакта
          photo:
            type: string
            format: binary
            description: Фото контакта
      encoding:
        photo:
          contentType: image/jpeg, image/png
responses:
  '200':
    description: Контакт успешно обновлен
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contact.yaml
  '404':
    description: Контакт с указанным ID не найден
  '400':
    description: Неверный запрос (например, некорректные данные)
